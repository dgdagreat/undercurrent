[pytest]
testpaths = tests
# Silence third-party deprecation noise (mostly shap's internal color utils and
# pyparsing) so the suite output stays readable. Our own warnings still show.
filterwarnings =
    ignore:.*np\.inexact.*:DeprecationWarning
    ignore:.*np\.floating.*:DeprecationWarning
    ignore::DeprecationWarning:pyparsing
    ignore::DeprecationWarning:shap
